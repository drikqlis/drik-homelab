---
# 1Password Secure Note "signal-cli-secret-values": Helm values (notesPlain), e.g. the auth proxy's tokens:
# proxy: {tokens: {"<sha256 hex of token>": {name: claude, number: "<bot>", recipients: ["<you>"]}}}
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: signal-cli-secret-values
  namespace: signal-cli
spec:
  itemPath: "vaults/Kubernetes/items/signal-cli-secret-values"
