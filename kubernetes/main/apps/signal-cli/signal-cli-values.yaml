---
apiVersion: v1
kind: ConfigMap
metadata:
  name: signal-cli-values
  namespace: signal-cli
data:
  values.yaml: |-
    replicaCount: 1

    image:
      tag: "0.102"

    # resident signal-cli daemon; incoming messages via websocket (Claude Code reply listener)
    mode: json-rpc
    extraEnv:
      - name: JSON_RPC_RECEIVE_MODE
        value: manual

    proxy:
      enabled: true
      queue:
        enabled: true

    ingress:
      enabled: true
      className: "nginx-internal"
      annotations:
        kubernetes.io/tls-acme: "true"
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        kubernetes.io/ingress.class: nginx-internal
        nginx.ingress.kubernetes.io/proxy-body-size: "64m"  # base64 attachments; matches the auth proxy MAX_BODY
      hosts:
        - host: signal.drik.it
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: signal-cli-certs
          hosts:
            - signal.drik.it

    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        size: 30Gi

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
